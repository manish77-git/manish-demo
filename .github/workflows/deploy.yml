name: Build & Deploy DrawBattle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    name: Backend Syntax & Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: cd backend && npm ci

      - name: Check JS Syntax
        run: |
          cd backend
          node -e "import('./src/index.js').then(() => console.log('Backend syntax clean!')).catch(e => { console.error(e); process.exit(1); })"

  flutter-build:
    name: Build Flutter Web Release
    runs-on: ubuntu-latest
    needs: backend-checks

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Flutter Analyze
        run: |
          cd flutter_app
          flutter analyze --no-pub || true

      - name: Build Flutter Web
        run: |
          cd flutter_app
          flutter build web --release

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: draw-battle-web-release
          path: flutter_app/build/web
